<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UsageLedger</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c2571a'/%3E%3Crect x='7' y='8' width='18' height='3' rx='1.5' fill='%23fff'/%3E%3Crect x='7' y='14.5' width='12' height='3' rx='1.5' fill='%23fff'/%3E%3Crect x='7' y='21' width='7' height='3' rx='1.5' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f7f6f3; --panel: #ffffff; --ink: #1d1c1a; --muted: #6b675f; --rule: #e4e1da;
  --claude: #c2571a; --codex: #1f7a6d; --acc: #c2571a; --focus: #2f5bd3;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121211; --panel: #1b1a19; --ink: #ecebe7; --muted: #a29e95; --rule: #2e2c29;
    --claude: #e9824a; --codex: #4fbfae; --acc: #e9824a; --focus: #8aa8ff;
  }
}
:root[data-theme="dark"] {
  --bg: #121211; --panel: #1b1a19; --ink: #ecebe7; --muted: #a29e95; --rule: #2e2c29;
  --claude: #e9824a; --codex: #4fbfae; --acc: #e9824a; --focus: #8aa8ff;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font); }
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 18px 32px; border-bottom: 1px solid var(--rule); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 17px; }
.brand svg { width: 26px; height: 26px; }
main { padding: 24px 32px 48px; display: grid; gap: 24px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; padding: 7px 12px; min-height: 36px; cursor: pointer; }
.seg button[aria-pressed="true"] { color: var(--ink); background: color-mix(in srgb, var(--acc) 14%, transparent); }
button:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.reads { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.read { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 18px; }
.read p { margin: 0; font-size: 16px; }
.read small { display: block; margin-top: 6px; color: var(--muted); font-size: 13px; }
.band { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 900px) { .band { grid-template-columns: 1fr; } header, main { padding-left: 16px; padding-right: 16px; } }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 18px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.panel-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
.foot { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
svg text { fill: var(--muted); font: 11px var(--font); }
.rank { display: grid; gap: 8px; }
.rank .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: 13px; }
.rank .bar { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--rule); overflow: hidden; }
.rank .bar span { display: block; height: 100%; border-radius: 4px; }
.rank .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 12.5px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--rule); }
.tabs button { font: inherit; font-size: 14px; background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; color: var(--muted); cursor: pointer; min-height: 40px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--acc); }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th { font-weight: 600; color: var(--muted); font-size: 12.5px; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
td.id { font-family: var(--mono); font-size: 12.5px; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid currentColor; }
.empty, .error { padding: 18px; border: 1px dashed var(--rule); border-radius: 10px; color: var(--muted); }
.error { color: var(--claude); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--acc)"/><rect x="7" y="8" width="18" height="3" rx="1.5" fill="#fff"/><rect x="7" y="14.5" width="12" height="3" rx="1.5" fill="#fff"/><rect x="7" y="21" width="7" height="3" rx="1.5" fill="#fff"/></svg>
    <span>UsageLedger</span>
  </div>
  <div class="seg" id="window" role="group" aria-label="Window">
    <button data-days="7">7 days</button><button data-days="30">30 days</button><button data-days="90">90 days</button><button data-days="all">All</button>
  </div>
</header>
<main id="main"><p class="empty">Reading the ledger.</p></main>
<script>
const LABEL = { claude_code: 'Claude Code', codex: 'Codex' };
const COLOR = { claude_code: 'var(--claude)', codex: 'var(--codex)' };
const TOOLS = ['claude_code', 'codex'];
const state = { days: '30', metric: 'total_tokens', dim: 'model', tab: 'sessions', data: null };
try { const saved = localStorage.getItem('usageledger:window'); if (saved) state.days = saved; } catch {}

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const int = (v) => Math.round(v || 0).toLocaleString('en-US');
const M = (t) => (t >= 1e9 ? `${(t / 1e9).toFixed(1)}B` : t >= 1e6 ? `${(t / 1e6).toFixed(1)}M` : t >= 1e4 ? `${Math.round(t / 1e3)}k` : t >= 1e3 ? `${(t / 1e3).toFixed(1).replace(/\.0$/, '')}k` : String(t || 0));
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);

async function load() {
  for (const b of document.querySelectorAll('#window button')) b.setAttribute('aria-pressed', String(b.dataset.days === state.days));
  const q = state.days === 'all' ? 'all=1' : `days=${state.days}`;
  try {
    const r = await fetch(`/api/summary?${q}`);
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.statusText);
    state.data = j;
    render();
  } catch (e) {
    document.getElementById('main').innerHTML = `<p class="error">The ledger could not be read: ${esc(e.message)}</p>`;
  }
}

function reads(s) {
  const t = s.totals;
  if (!t.all.turns) return `<p class="empty">The ledger has no usage between ${esc(s.since)} and ${esc(s.until)}. Run <code>usageledger sync</code> to read the logs.</p>`;
  const cards = [`<div class="read"><p>Both tools used <b>${M(t.all.total_tokens)}</b> tokens and wrote <b>${M(t.all.output_tokens)}</b> of them.</p><small>${int(t.all.sessions)} sessions from ${esc(s.since)} to ${esc(s.until)}</small></div>`];
  for (const tool of TOOLS) {
    const x = t[tool];
    cards.push(`<div class="read"><p>${LABEL[tool]} used <b>${M(x.total_tokens)}</b> tokens, ${pct(x.total_tokens, t.all.total_tokens)}% of the window, and wrote <b>${M(x.output_tokens)}</b>.</p><small>${int(x.sessions)} sessions, ${int(x.turns)} responses</small></div>`);
  }
  cards.push(`<div class="read"><p>Cache reads were <b>${pct(t.all.cache_read_tokens, t.all.total_tokens)}%</b> of all tokens.</p><small>Input served from the prompt cache</small></div>`);
  return `<section class="reads">${cards.join('')}</section>`;
}

function dailyChart(s) {
  const m = state.metric;
  const per = s.days.map((day) => {
    const v = { day };
    for (const tool of TOOLS) v[tool] = 0;
    for (const r of s.daily) if (r.day === day) v[r.tool] += r[m] || 0;
    return v;
  });
  const max = Math.max(1, ...per.map((d) => d.claude_code + d.codex));
  const W = 640, H = 220, padL = 44, padB = 22, n = Math.max(1, per.length);
  const bw = Math.max(2, (W - padL) / n - 2);
  let bars = '';
  per.forEach((d, i) => {
    let y = H - padB;
    const x = padL + i * ((W - padL) / n) + 1;
    for (const tool of TOOLS) {
      const h = ((d[tool] || 0) / max) * (H - padB - 10);
      if (h > 0) { y -= h; bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${COLOR[tool]}"><title>${esc(d.day)} ${LABEL[tool]}: ${int(d[tool])}</title></rect>`; }
    }
  });
  const ticks = [0, 0.5, 1].map((f) => { const y = H - padB - f * (H - padB - 10); return `<text x="${padL - 6}" y="${(y + 4).toFixed(1)}" text-anchor="end">${M(max * f)}</text><line x1="${padL}" x2="${W}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--rule)"/>`; }).join('');
  const step = Math.max(1, Math.ceil(n / 8));
  const labels = per.map((d, i) => (i % step === 0 ? `<text x="${(padL + i * ((W - padL) / n) + bw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(d.day.slice(5))}</text>` : '')).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Tokens per day by tool">${ticks}${bars}${labels}</svg>`;
}

function ranked(s, limit) {
  const m = state.metric;
  const by = new Map();
  for (const r of s.ranks) {
    if (r.dim !== state.dim) continue;
    const e = by.get(r.key) || { key: r.key, value: 0, claude_code: 0, codex: 0 };
    e.value += r[m] || 0; e[r.tool] += r[m] || 0; by.set(r.key, e);
  }
  const rows = [...by.values()].sort((a, b) => b.value - a.value);
  return { rows, html: rows.length ? `<div class="rank">${rows.slice(0, limit).map((e) => `<div class="row"><span class="name" title="${esc(e.key)}">${esc(e.key)}</span><span>${M(e.value)}</span><div class="bar"><span style="width:${pct(e.value, rows[0].value)}%;background:${COLOR[e.codex > e.claude_code ? 'codex' : 'claude_code']}"></span></div></div>`).join('')}</div>` : `<p class="empty">No rows on the ${esc(state.dim)} axis in this window.</p>` };
}

function seg(id, options, on) {
  return `<div class="seg" id="${id}" role="group">${options.map(([v, l]) => `<button data-v="${v}" aria-pressed="${v === on}">${l}</button>`).join('')}</div>`;
}

function sessionsTable(s) {
  if (!s.sessions.length) return '<p class="empty">No session in this window.</p>';
  return `<div class="scroll"><table><thead><tr><th>Repo</th><th>Tool</th><th>Model</th><th>Started</th><th class="n">Turns</th><th class="n">Output</th><th class="n">Total</th></tr></thead><tbody>${s.sessions.map((x) => `<tr><td>${esc(x.repo ?? 'unrecorded')}</td><td><span class="chip" style="color:${COLOR[x.tool]}">${LABEL[x.tool]}</span></td><td class="id">${esc(x.model ?? 'unrecorded')}</td><td class="id">${esc(String(x.started_at).slice(0, 16).replace('T', ' '))}</td><td class="n">${int(x.turns)}</td><td class="n">${M(x.output_tokens)}</td><td class="n">${M(x.total_tokens)}</td></tr>`).join('')}</tbody></table></div>`;
}

function daysTable(s) {
  if (!s.daily.length) return '<p class="empty">No usage in this window.</p>';
  return `<div class="scroll"><table><thead><tr><th>Day</th><th>Tool</th><th class="n">Sessions</th><th class="n">Turns</th><th class="n">Input</th><th class="n">Cache read</th><th class="n">Cache write</th><th class="n">Output</th><th class="n">Total</th></tr></thead><tbody>${[...s.daily].reverse().map((x) => `<tr><td class="id">${esc(x.day)}</td><td><span class="chip" style="color:${COLOR[x.tool]}">${LABEL[x.tool]}</span></td><td class="n">${int(x.sessions)}</td><td class="n">${int(x.turns)}</td><td class="n">${M(x.input_tokens)}</td><td class="n">${M(x.cache_read_tokens)}</td><td class="n">${M(x.cache_write_tokens)}</td><td class="n">${M(x.output_tokens)}</td><td class="n">${M(x.total_tokens)}</td></tr>`).join('')}</tbody></table></div>`;
}

function render() {
  const s = state.data;
  const rk = ranked(s, 6);
  const metricLabel = state.metric === 'total_tokens' ? 'Tokens' : 'Output tokens';
  const tabs = [['sessions', `Heaviest sessions (${s.sessions.length})`], ['days', `Per day (${s.daily.length})`], ['ranked', `Ranked (${rk.rows.length})`]];
  let body = '';
  if (state.tab === 'sessions') body = sessionsTable(s);
  if (state.tab === 'days') body = daysTable(s);
  if (state.tab === 'ranked') body = ranked(s, 30).html;
  document.getElementById('main').innerHTML = `
    ${reads(s)}
    <section class="band">
      <div class="panel">
        <div class="panel-head"><h2>${metricLabel} per day, by tool</h2>${seg('metric', [['total_tokens', 'Total'], ['output_tokens', 'Output']], state.metric)}</div>
        ${dailyChart(s)}
        <div class="legend">${TOOLS.map((t) => `<span><i style="background:${COLOR[t]}"></i>${LABEL[t]}</span>`).join('')}</div>
        <p class="foot">Total counts cache reads, which dominate a long Claude session. Output is what the models wrote.</p>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Ranked by ${esc(state.dim)}</h2>${seg('dim', [['model', 'Model'], ['repo', 'Repo'], ['origin', 'Origin']], state.dim)}</div>
        ${rk.html}
        <p class="foot">The top six of ${int(rk.rows.length)}. A bar takes the colour of the tool that spent most of it.</p>
      </div>
    </section>
    <section class="panel">
      <div class="tabs" role="tablist">${tabs.map(([v, l]) => `<button role="tab" data-tab="${v}" aria-selected="${v === state.tab}">${l}</button>`).join('')}</div>
      ${body}
    </section>
    <p class="foot">The ledger holds ${int(s.rowCount)} responses. The newest is from ${esc(s.newest || 'no time yet')}. By default working directories are stored as salted hashes, so the repo column holds only a base name.</p>`;
  for (const b of document.querySelectorAll('#metric button')) b.onclick = () => { state.metric = b.dataset.v; render(); };
  for (const b of document.querySelectorAll('#dim button')) b.onclick = () => { state.dim = b.dataset.v; render(); };
  for (const b of document.querySelectorAll('[data-tab]')) b.onclick = () => { state.tab = b.dataset.tab; render(); };
}

for (const b of document.querySelectorAll('#window button')) b.onclick = () => {
  state.days = b.dataset.days;
  try { localStorage.setItem('usageledger:window', state.days); } catch {}
  load();
};
load();
</script>
</body>
</html>
